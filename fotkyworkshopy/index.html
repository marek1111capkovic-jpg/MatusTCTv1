<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fotky Workshopy — Galéria</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    header.scrolled {
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      height: 70px;
    }

    .logo { display:flex; align-items:center; gap:12px; text-decoration:none; }

    .logo-img { height:56px; width:auto; display:block; }

    nav a {
      text-decoration: none;
      color: #fff;
      margin: 0 20px;
      font-weight: 400;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      position: relative;
    }

    nav a:hover {
      color: #ff4444;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: #ff4444;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background: linear-gradient(45deg, #0a0a0a, #1a1a1a, #2a0a0a);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 10%;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(255, 68, 68, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 68, 68, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }

    .hero h1 {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #fff, #ff4444, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .hero p {
      font-size: 1.4rem;
      margin-bottom: 40px;
      color: #ccc;
      line-height: 1.6;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 2rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
      40% { transform: translateX(-50%) translateY(-10px); }
      60% { transform: translateX(-50%) translateY(-5px); }
    }

    /* GALLERY SECTION */
    .gallery-section {
      padding: 100px 20px;
      background: #0a0a0a;
      min-height: 100vh;
    }

    .section-title {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 60px;
      text-transform: uppercase;
      letter-spacing: 3px;
      position: relative;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff4444, transparent);
    }

    /* Enhanced Masonry Gallery */
    .gallery {
      column-count: 1;
      column-gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (min-width: 768px) { .gallery { column-count: 2; } }
    @media (min-width: 1024px) { .gallery { column-count: 3; } }
    @media (min-width: 1440px) { .gallery { column-count: 4; } }

    .photo {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      background: #1a1a1a;
      cursor: pointer;
      transform: translateY(50px);
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .photo:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 40px rgba(255, 68, 68, 0.3);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.8s ease;
    }

    .photo:hover img {
      transform: scale(1.1);
    }

    .photo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.8) 100%);
      display: flex;
      align-items: flex-end;
      padding: 20px;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .photo:hover .photo-overlay {
      opacity: 1;
    }

    .photo-info {
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .photo:hover .photo-info {
      transform: translateY(0);
    }

    .photo-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #fff;
    }

    /* skryť veľkosť fotky (nebudeme ju zobrazovať) */
    .photo-size { display: none !important; }

    /* ENHANCED LIGHTBOX */
    .lb {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      backdrop-filter: blur(10px);
    }

    .lb.visible {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .lb-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      animation: zoomIn 0.4s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .lb-info {
      position: absolute;
      bottom: -60px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #fff;
    }

    .lb-title {
      font-size: 1.4rem;
      margin-bottom: 5px;
    }

    .lb-counter {
      font-size: 1rem;
      color: #ccc;
    }

    .lb .close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      z-index: 2001;
    }

    .lb .close:hover {
      background: rgba(255, 68, 68, 0.8);
      transform: rotate(90deg);
    }

    .lb .controls {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      padding: 0 20px;
    }

    .lb button {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 2.5rem;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .lb button:hover {
      background: rgba(255, 68, 68, 0.8);
      transform: scale(1.1);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 1.2rem;
    }

    .loading-spinner {
      border: 3px solid #333;
      border-top: 3px solid #ff4444;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* FOOTER */
    footer {
      background: #0a0a0a;
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid #222;
    }

    .footer-content {
      max-width: 600px;
      margin: 0 auto;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
    }

    .footer-links a {
      color: #ccc;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-links a:hover {
      color: #ff4444;
    }

    .copyright {
      color: #666;
      font-size: 0.9rem;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      header {
        padding: 0 20px;
        height: 70px;
      }

      nav {
        display: none;
      }

      .hero h1 {
        font-size: 3rem;
      }

      .hero p {
        font-size: 1.1rem;
      }

      .section-title {
        font-size: 2.5rem;
      }

      .lb button {
        width: 50px;
        height: 50px;
        font-size: 2rem;
      }

      .lb .close {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: 2.2rem;
      }

      .gallery {
        column-gap: 10px;
      }

      .photo {
        margin-bottom: 10px;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <a href="../index.html" class="logo">
      <img src="../photos/TCT logo.png" alt="Matus TCT" class="logo-img" >
    </a>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>MATUS TCT</h1>
      <p>Preskúmajte úžasné momenty z našich workshopov. Každá fotka rozpráva príbeh inšpirácie a tvorivosti.</p>
    </div>
    <div class="scroll-indicator">
      <i class="fas fa-chevron-down"></i>
    </div>
  </section>

  <!-- Gallery Section -->
  <section id="gallery-section" class="gallery-section">
    <h2 class="section-title">Fotky z Workshopov</h2>
    
    <main>
      <div id="gallery" class="gallery" aria-live="polite"></div>
      <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        Načítavam fotografie...
      </div>
    </main>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lb" role="dialog" aria-modal="true" aria-label="Zväčšený obrázok">
    <button class="close" id="lbClose" title="Zavrieť">
      <i class="fas fa-times"></i>
    </button>
    <div class="lb-content">
      <img id="lbImg" alt="">
      <div class="lb-info">
        <div id="lbTitle" class="lb-title"></div>
        <div id="lbCounter" class="lb-counter"></div>
      </div>
    </div>
    <div class="controls">
      <button id="prev" title="Predchádzajúci">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button id="next" title="Ďalší">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <div class="footer-links">
        <a href="#gallery-section">Galéria</a>
        <a href="#about">O nás</a>
        <a href="#contact">Kontakt</a>
      </div>
      <div class="copyright">
        &copy; 2024 Workshop Fotogaléria. Všetky práva vyhradené.
      </div>
    </div>
  </footer>

  <script>
    // API URL z vášho Google Apps Script
    const API_URL = 'https://script.google.com/macros/s/AKfycbzbxNV2Lb4Tqf9mnXBf-4gQO8Zgw3lmBr9u2nWxRQUutEFpRjrJ8sodjEy1Y_HC3j6VMA/exec';

    const gallery = document.getElementById('gallery');
    const loadingEl = document.getElementById('loading');
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbTitle = document.getElementById('lbTitle');
    const lbCounter = document.getElementById('lbCounter');
    const lbClose = document.getElementById('lbClose');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let photos = [];
    let currentIndex = 0;

    // Header scroll effect
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.scrollY > 100) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });

    // Render photos with enhanced design
    function renderPhotos(list){
      gallery.innerHTML = '';
      list.forEach((p, i) => {
        const photoDiv = document.createElement('div');
        photoDiv.className = 'photo';
        photoDiv.style.animationDelay = `${i * 0.1}s`;
        photoDiv.dataset.index = i;

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = p.title || `Fotka ${i+1}`;
        img.src = p.url;

        const overlay = document.createElement('div');
        overlay.className = 'photo-overlay';

        const info = document.createElement('div');
        info.className = 'photo-info';

        const title = document.createElement('div');
        title.className = 'photo-title';
        title.textContent = p.title || 'Fotka';

        // už nepridávame element so šírkou/veľkosťou - skrytý cez CSS
        info.appendChild(title);
        overlay.appendChild(info);
        photoDiv.appendChild(img);
        photoDiv.appendChild(overlay);

        photoDiv.addEventListener('click', () => openLightbox(i));
        gallery.appendChild(photoDiv);
      });
    }

    // Enhanced lightbox
    function openLightbox(index){
      currentIndex = index;
      const p = photos[index];
      lbImg.src = p.url;
      lbImg.alt = p.title || '';
      lbTitle.textContent = p.title || 'Fotka';
      lbCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
      lb.classList.add('visible');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(){ 
      lb.classList.remove('visible'); 
      lbImg.src = '';
      document.body.style.overflow = 'auto';
    }

    function showNext(delta){
      currentIndex = (currentIndex + delta + photos.length) % photos.length;
      const p = photos[currentIndex];
      lbImg.src = p.url;
      lbImg.alt = p.title || '';
      lbTitle.textContent = p.title || 'Fotka';
      lbCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
    }

    // Event listeners
    lbClose.addEventListener('click', closeLightbox);
    nextBtn.addEventListener('click', () => showNext(1));
    prevBtn.addEventListener('click', () => showNext(-1));
    
    lb.addEventListener('click', (e) => { 
      if(e.target === lb) closeLightbox(); 
    });

    document.addEventListener('keydown', (e) => {
      if(!lb.classList.contains('visible')) return;
      if(e.key === 'Escape') closeLightbox();
      if(e.key === 'ArrowRight') showNext(1);
      if(e.key === 'ArrowLeft') showNext(-1);
    });

    // Load photos from API
    async function load(){
      loadingEl.textContent = 'Načítavam fotografie…';
      try {
        const res = await fetch(API_URL, {cache: 'no-store'});
        if(!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const data = await res.json();
        
        if(data.success && data.photos && data.photos.length > 0){
          photos = data.photos;
          renderPhotos(photos);
          loadingEl.style.display = 'none';
        } else {
          loadingEl.textContent = 'Žiadne fotografie nájdené.';
        }
      } catch(err){
        console.error('Chyba pri načítaní:', err);
        loadingEl.innerHTML = `
          <div style="color: #ff4444; margin-bottom: 20px;">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 10px;"></i>
            <div>Chyba pri načítaní fotografií</div>
          </div>
          <button onclick="location.reload()" style="
            background: #ff4444; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer;
            font-family: inherit;
          ">Skúsiť znova</button>
        `;
      }
    }

    // Smooth scrolling for navigation
    document.querySelectorAll('nav a, .footer-links a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = link.getAttribute('href');
        if(targetId.startsWith('#')) {
          const targetElement = document.querySelector(targetId);
          if(targetElement) {
            targetElement.scrollIntoView({ behavior: 'smooth' });
          }
        }
      });
    });

    // Initialize
    load();
  </script>
</body>
</html>
