<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kúpiť - Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; }
    button { padding: 12px 18px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Kúpiť produkt</h1>
  <p>Demo produkt — cena cez Stripe Checkout</p>
  <button id="buy">Kúpiť teraz</button>

  <script>
document.getElementById('buy').addEventListener('click', async () => {
  try {
    console.log('🔄 Začínam platbu...');
    
    const res = await fetch('https://matus-tc-tv1.vercel.app/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        priceId: 'price_XXXXXXXXXXXXXXXX', // zmeň na svoj price_id
        quantity: 1
      })
    });
    
    console.log('✅ Response status:', res.status);
    console.log('✅ Response ok:', res.ok);
    
    const data = await res.json();
    console.log('✅ Response data:', data);
    
    if (data.url) {
      console.log('🎯 Presmerúvam na Stripe Checkout...');
      window.location = data.url;
    } else {
      console.error('❌ Chyba z API:', data);
      alert('Chyba pri vytváraní platby: ' + (data.error || 'unknown'));
    }
  } catch (err) {
    console.error('❌ Network error:', err);
    alert('Network error: ' + err.message);
  }
});
</script>
</body>
</html>
